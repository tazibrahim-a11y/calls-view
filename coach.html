<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{

  --warn:#8a5c0a;--warn-bg:#fdf2dc;
  --danger:#8b2e2e;--danger-bg:#fdeaea;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text-primary);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-left{display:flex;align-items:center;gap:10px}
.rep-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rep-avatar.tl{background:#2c5f7a}
.rep-name{font-size:14px;font-weight:600}
.rep-role{font-size:11px;color:var(--text-tertiary)}
.header-right{display:flex;align-items:center;gap:8px}
.dash-link{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;padding:5px 10px;border:1px solid var(--accent);border-radius:6px;white-space:nowrap}
.dash-link:hover{background:var(--accent-bg)}
.period-badge{font-size:11px;font-weight:500;color:var(--text-tertiary);font-family:var(--mono);padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px}
.stats-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;gap:1.5rem;align-items:center;flex-shrink:0;overflow-x:auto}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat-label{font-size:11px;color:var(--text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text-primary)}
.stat-value.green{color:var(--accent)}.stat-value.amber{color:var(--warn)}.stat-value.red{color:var(--danger)}
.stat-sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.overdue-pill{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;background:var(--danger-bg);color:var(--danger)}
.chat-area{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:12px}
.message{display:flex;gap:10px;max-width:700px}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.message.assistant{align-self:flex-start}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:2px}
.message.user .msg-avatar{background:var(--accent);color:#fff}
.message.user .msg-avatar.tl{background:#2c5f7a}
.message.assistant .msg-avatar{background:var(--border);color:var(--text-secondary);font-size:10px}
.msg-bubble{padding:.75rem 1rem;border-radius:12px;font-size:13px;line-height:1.6;max-width:580px}
.message.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.message.user.tl-user .msg-bubble{background:#2c5f7a}
.message.assistant .msg-bubble{background:var(--ai-bubble, var(--surface));border:1px solid var(--border);color:var(--text-primary);border-bottom-left-radius:3px}
.msg-bubble p{margin-bottom:.5rem}.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble strong{font-weight:600}
.msg-bubble ul{margin:.4rem 0 .4rem 1.1rem}.msg-bubble li{margin-bottom:.2rem}
.typing{display:flex;align-items:center;gap:4px;padding:.6rem .8rem}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 1.5rem .75rem;flex-shrink:0}
.suggestion{font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.suggestion:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.input-area{padding:.75rem 1.5rem 1rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font-family:var(--sans);font-size:13px;color:var(--text-primary);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.65rem .9rem;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--text-tertiary)}
button.send{width:36px;height:36px;border-radius:8px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
button.send:hover{opacity:.85}
button.send:disabled{opacity:.4;cursor:not-allowed}
button.send svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

Overdue (${overdue.length}): ${overdue.map(n=>`${n.partner} — ${n.action}`).join(' | ')||'none'}
Upcoming (${upcoming.length}): ${upcoming.map(n=>`${n.partner} — ${n.action}`).join(' | ')}

COACHING:
Focus: ${d.coaching.focus}
Strength: ${d.coaching.strength}
MAP gap: ${d.coaching.map_gap}

PIPELINE (${d.pipeline.market}):
${Object.entries(d.pipeline.june_sqls).map(([m,v])=>`${m}: ${v.actual}/${v.target} SQLs`).join(' | ')}
${d.pipeline.insight}

Speak directly to ${d.name.split(' ')[0]} ("your calls", "you scored"). Never say "the rep" or refer to them in third person.`;
}

let history = [];
let repKey = 'jara';

function getRepFromUrl() {
  const p = new URLSearchParams(window.location.search);
  const r = p.get('rep');
  return r && REPS[r.toLowerCase()] ? r.toLowerCase() : 'jara';
}

function renderStats(rep) {
  const d = REPS[rep];
  const overdue = d.next_steps.filter(n=>n.overdue).length;
  if (d.isTL) {
    const t = d.team_summary;
    const p = d.pipeline;
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><span class="stat-label">Team calls</span><span class="stat-value">${d.calls}</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Team avg</span><span class="stat-value ${d.avg_score>=4?'green':'amber'}">${d.avg_score}/5</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Agreements sent</span><span class="stat-value green">2</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Jun SQLs</span><span class="stat-value red">${p.june_total.actual} / ${p.june_total.target}</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">GB SQLs</span><span class="stat-value red">${p.june_sqls.GB.actual} / ${p.june_sqls.GB.target}</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Flags</span><span class="overdue-pill">2</span></div>`;
  } else {
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><span class="stat-label">Calls</span><span class="stat-value">${d.calls}</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Avg score</span><span class="stat-value ${d.avg_score>=4?'green':d.avg_score>=3?'amber':'red'}">${d.avg_score}/5</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-value green">${d.best_call.split('(')[0].trim()}</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Next steps</span><span class="stat-value">${d.next_steps.length}</span></div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Overdue</span>${overdue>0?`<span class="overdue-pill">${overdue}</span>`:`<span class="stat-value green">0</span>`}</div>
      <div class="stat-sep"></div>
      <div class="stat"><span class="stat-label">Jun SQLs</span><span class="stat-value red">13 / 64</span></div>`;
  }
}

function renderSuggestions(rep) {
  const s = SUGGESTIONS[rep]||[];
  document.getElementById('suggestions').innerHTML = s.map(q=>
    `<button class="suggestion" onclick="sendSuggestion('${q.replace(/'/g,"\\'")}')"> ${q}</button>`
  ).join('');
}

function addMessage(role, text) {
  const area = document.getElementById('chat-area');
  const d = REPS[repKey];
  const div = document.createElement('div');
  div.className = `message ${role}${d.isTL&&role==='user'?' tl-user':''}`;
  const uAvatar = `<div class="msg-avatar${d.isTL?' tl':''}">${d.initials}</div>`;
  const aAvatar = `<div class="msg-avatar">AI</div>`;
  div.innerHTML = `${role==='user'?uAvatar:aAvatar}<div class="msg-bubble">${formatText(text)}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/((<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>')
    .split('\n\n').map(p=>p.startsWith('<ul>')?p:`<p>${p}</p>`).join('');
}

function addTyping() {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className='message assistant';div.id='typing-indicator';
  div.innerHTML=`<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
function removeTyping(){const el=document.getElementById('typing-indicator');if(el)el.remove();}

async function callClaude(userMessage) {
  history.push({role:'user',content:userMessage});
  document.getElementById('send-btn').disabled=true;
  addTyping();
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:buildSystem(repKey),messages:history})
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text||"Sorry, I couldn't generate a response.";
    history.push({role:'assistant',content:reply});
    removeTyping();addMessage('assistant',reply);
  } catch(e){removeTyping();addMessage('assistant',"Something went wrong. Please try again.");}
  document.getElementById('send-btn').disabled=false;
}

function send() {
  const input=document.getElementById('input');
  const text=input.value.trim();
  if(!text)return;
  input.value='';input.style.height='auto';
  addMessage('user',text);
  document.getElementById('suggestions').style.display='none';
  callClaude(text);
}
function sendSuggestion(text){document.getElementById('input').value=text;send();}

const textarea=document.getElementById('input');
textarea.addEventListener('input',function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';
  document.getElementById('send-btn').disabled=!this.value.trim();
});
textarea.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

/* Init */
repKey=getRepFromUrl();
const d=REPS[repKey];
const avatar=document.getElementById('rep-avatar');
avatar.textContent=d.initials;
if(d.isTL)avatar.classList.add('tl');
document.getElementById('rep-name').textContent=d.name;
document.getElementById('rep-role').textContent=d.role;
renderStats(repKey);renderSuggestions(repKey);

if(d.isTL){

  openingMsg=`Hi Taz 👋 Here's your team summary for **June 1–11**.

Ask me anything about your team, reps, pipeline, or what to focus on in 1:1s.`;
} else {
  const overdue=d.next_steps.filter(n=>n.overdue);
  openingMsg=`Hi ${d.name.split(' ')[0]} 👋 Here's your calls summary for **June 1–11**.

**${d.calls} calls | Avg score ${d.avg_score}/5**
🏆 Best: ${d.best_call}
${d.worst_call?`⚠️ Weakest: ${d.worst_call}`:''}

**Main focus this week:** ${d.coaching.focus}

${overdue.length>0?`**Overdue:** ${overdue.map(n=>`${n.partner} — ${n.action}`).join(' | ')} — action these today.`:'No overdue items — good.'}

Ask me anything about your calls, next steps, or what to prioritise.`;
}
setTimeout(()=>addMessage('assistant',openingMsg),400);
</script>
