body{font-family:var(--sans);background:var(--bg);color:var(--text-primary);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.dash-link{font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;padding:5px 10px;border:1px solid var(--accent);border-radius:6px}
.stats-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;gap:1.5rem;align-items:center;flex-shrink:0;overflow-x:auto}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat-label{font-size:11px;color:var(--text-tertiary);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text-primary)}
.stat-value.green{color:var(--accent)}.stat-value.amber{color:var(--warn)}.stat-value.red{color:var(--danger)}
.stat-sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.baseline-note{background:var(--warn-bg);border-bottom:1px solid #e0c98a;padding:.5rem 1.5rem;font-size:11px;color:var(--warn);flex-shrink:0}
.chat-area{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:12px}
.message{display:flex;gap:10px;max-width:700px}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.message.assistant{align-self:flex-start}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-top:2px}
.message.user .msg-avatar{background:var(--accent);color:#fff}
.message.assistant .msg-avatar{background:var(--border);color:var(--text-secondary);font-size:10px}
.msg-bubble{padding:.75rem 1rem;border-radius:12px;font-size:13px;line-height:1.6;max-width:580px}
.message.user .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.message.assistant .msg-bubble{background:var(--surface);border:1px solid var(--border);color:var(--text-primary);border-bottom-left-radius:3px}
.msg-bubble p{margin-bottom:.5rem}.msg-bubble p:last-child{margin-bottom:0}
.msg-bubble strong{font-weight:600}
.msg-bubble ul{margin:.4rem 0 .4rem 1.1rem}.msg-bubble li{margin-bottom:.2rem}
.typing{display:flex;align-items:center;gap:4px;padding:.6rem .8rem}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-tertiary);animation:bounce .9s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 1.5rem .75rem;flex-shrink:0}
.suggestion{font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .15s;white-space:nowrap}
.suggestion:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.input-area{padding:.75rem 1.5rem 1rem;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font-family:var(--sans);font-size:13px;color:var(--text-primary);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.65rem .9rem;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--text-tertiary)}
button.send{width:36px;height:36px;border-radius:8px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
button.send:hover{opacity:.85}button.send:disabled{opacity:.4;cursor:not-allowed}
button.send svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── build system prompt ── */
function buildSystemPrompt(rep){
  const r=REPS[rep];
  if(!r)return'You are a coaching assistant.';
  const scoredTypes=['sourcing','discovery','demo','management'].filter(t=>r[t]&&r[t].length);
  const callLines=scoredTypes.map(t=>{
    const calls=r[t];
    return `${t.toUpperCase()} (${calls.length} calls, avg ${(calls.reduce((s,c)=>s+c.s,0)/calls.length).toFixed(1)}/5):\n`+
      calls.map(c=>`  - ${c.t}: ${c.s}/5${c.gap?` | Gap: ${c.gap}`:''}`).join('\n');
  }).join('\n\n');

  return `You are a Partnerships coaching assistant for the Moss/Nufin partnerships team. You are coaching ${r.name}, ${r.role} (${r.market} market).

WEEK: w/c Jul 28, 2026 — Q3 Week 2
IMPORTANT: These are the first scores under new scorecards. This is the Q3 baseline. Scores are NOT comparable to Q2.

SCORECARD OVERVIEW (new from Jul 21):
- Sourcing: O(w2)·R(w3)·Q(w3)·VP(w2)·OBJ(w2,N/A if none)·MTG(w3)
  Key change: Research and Qualification now weighted x3. Old scorecard had equal weights.
- Discovery: RAP(w2)·R(w2)·CB(w3)·ADM(w3)·CH(w2)·NS(w3)  
  Key change: Rapport and Research added. Access to Decision Moment (ADM) requires specific example for 4+. Path-dependent NS.
- Demo: TLR(w3)·REF(w3)·COM(w2)·OBJ(w2,N/A)·ENG(w2)·NS(w3)
  Key change: REF (Referral Moment Clarity) is the most important criterion — coaching when and how to recommend.
- Management Check-in: WRM(w2)·HLT(w2)·REF(w3)·NS(w3)
- Management Pipeline Review: REFS(w3)·BLK(w3)·STALE(w2)·NEWREF(w2)·NS(w3)  
- Management Product Enablement: GAP(w2)·PRD(w3)·UND(w3)·RMC(w2)·NS(w2)
- Management QBR: PERF(w3)·WG(w2)·PLAN(w3)·COM(w2)·NS(w3)

${r.name.toUpperCase()}'S DATA THIS WEEK:
Overall: ${r.calls} calls scored · Avg ${r.avg_score!=null?r.avg_score+'/5':'no data'}

${callLines||'No scored calls this week.'}

${r.vm_note?'NOTE: '+r.vm_note+'\n\n':''}HIGHLIGHTS: ${r.highlights.join(' | ')||'None'}
FLAGS: ${r.flags.join(' | ')||'None'}

COACHING CONTEXT:
Focus: ${r.coaching.focus}
Strength: ${r.coaching.strength}
Key action: ${r.coaching.key_action}

Notion page: https://app.notion.com/p/${r.notion||''}

RESPONSE STYLE:
- Direct and honest. No praise padding.
- Reference specific calls by name with scores when relevant.
- Keep responses concise — 2-4 short paragraphs max unless the rep asks for detail.
- If asked about scores, explain what the criterion measures, not just the number.
- Never mention "pre-call clarity" — that criterion was removed in Q3. Focus on preparation, purpose, and research instead.`;
}

/* ── state ── */
const params=new URLSearchParams(window.location.search);
const repKey=params.get('rep')||'jara';
const rep=REPS[repKey];
if(rep){
  document.getElementById('rep-avatar').textContent=rep.initials;
  document.getElementById('rep-name').textContent=rep.name;
  document.getElementById('rep-role').textContent=rep.role+' · '+rep.market;
}

/* ── stats bar ── */
function buildStats(){
  if(!rep)return;
  const calls=['sourcing','discovery','demo','management'].reduce((s,t)=>s+(rep[t]?rep[t].length:0),0);
  const allScores=['sourcing','discovery','demo','management'].flatMap(t=>rep[t]?rep[t].map(c=>c.s):[]);
  const avg=allScores.length?(allScores.reduce((a,b)=>a+b,0)/allScores.length).toFixed(1):null;
  const cls=v=>v>=4?'green':v>=3?'amber':'red';
  const srcAvg=rep.sourcing&&rep.sourcing.length?(rep.sourcing.reduce((s,c)=>s+c.s,0)/rep.sourcing.length).toFixed(1):null;
  const disAvg=rep.discovery&&rep.discovery.length?(rep.discovery.reduce((s,c)=>s+c.s,0)/rep.discovery.length).toFixed(1):null;
  const demAvg=rep.demo&&rep.demo.length?(rep.demo.reduce((s,c)=>s+c.s,0)/rep.demo.length).toFixed(1):null;
  const mgtAvg=rep.management&&rep.management.length?(rep.management.reduce((s,c)=>s+c.s,0)/rep.management.length).toFixed(1):null;

  let html=`<div class="stat"><span class="stat-label">Calls</span><span class="stat-value">${calls}</span></div>`;
  if(avg)html+=`<div class="stat-sep"></div><div class="stat"><span class="stat-label">Avg</span><span class="stat-value ${cls(avg)}">${avg}</span></div>`;
  if(srcAvg)html+=`<div class="stat-sep"></div><div class="stat"><span class="stat-label">Sourcing</span><span class="stat-value ${cls(srcAvg)}">${srcAvg}</span></div>`;
  if(disAvg)html+=`<div class="stat-sep"></div><div class="stat"><span class="stat-label">Discovery</span><span class="stat-value ${cls(disAvg)}">${disAvg}</span></div>`;
  if(demAvg)html+=`<div class="stat-sep"></div><div class="stat"><span class="stat-label">Demo</span><span class="stat-value ${cls(demAvg)}">${demAvg}</span></div>`;
  if(mgtAvg)html+=`<div class="stat-sep"></div><div class="stat"><span class="stat-label">Management</span><span class="stat-value ${cls(mgtAvg)}">${mgtAvg}</span></div>`;
  if(rep.flags&&rep.flags.length)html+=`<div class="stat-sep"></div><div class="stat"><span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--danger-bg);color:var(--danger)">${rep.flags.length} flag${rep.flags.length>1?'s':''}</span></div>`;
  document.getElementById('stats-bar').innerHTML=html;
}
buildStats();

/* ── chat ── */
const history=[];
const systemPrompt=buildSystemPrompt(repKey);

function addMsg(role,text){
  const el=document.createElement('div');
  el.className='message '+(role==='user'?'user':'assistant');
  const isUser=role==='user';
  el.innerHTML=`<div class="msg-avatar">${isUser?(rep?rep.initials[0]:'U'):'AI'}</div><div class="msg-bubble">${text.replace(/\n/g,'<br>')}</div>`;
  document.getElementById('chat-area').appendChild(el);
  el.scrollIntoView({block:'end',behavior:'smooth'});
  return el;
}

function addTyping(){
  const el=document.createElement('div');
  el.className='message assistant';
  el.id='typing-indicator';
  el.innerHTML=`<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  document.getElementById('chat-area').appendChild(el);
  el.scrollIntoView({block:'end',behavior:'smooth'});
}

async function sendMessage(text){
  if(!text.trim())return;
  document.getElementById('input').value='';
  document.getElementById('send-btn').disabled=true;
  document.getElementById('suggestions').style.display='none';
  addMsg('user',text);
  history.push({role:'user',content:text});
  addTyping();

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system:systemPrompt,
        messages:history
      })
    });
    const data=await res.json();
    document.getElementById('typing-indicator')?.remove();
    const reply=data.content?.[0]?.text||'Sorry, no response.';
    addMsg('assistant',reply);
    history.push({role:'assistant',content:reply});
  }catch(e){
    document.getElementById('typing-indicator')?.remove();
    addMsg('assistant','Error reaching the API. Please try again.');
  }
  document.getElementById('send-btn').disabled=false;
}

/* ── opening message ── */
function openingMessage(){
  if(!rep)return;
  const allScores=['sourcing','discovery','demo','management'].flatMap(t=>rep[t]?rep[t].map(c=>c.s):[]);
  const avg=allScores.length?(allScores.reduce((a,b)=>a+b,0)/allScores.length).toFixed(1):null;
  const highlights=rep.highlights.slice(0,2).join('<br>');
  const flags=rep.flags.slice(0,2).join('<br>');
  let msg=`<strong>Q3 Week 2 — w/c Jul 28, 2026</strong><br>`;
  msg+=`<em>First run on new scorecards. This is your Q3 baseline — not comparable to Q2.</em><br><br>`;
  if(avg)msg+=`<strong>Your avg this week:</strong> ${avg}/5 across ${allScores.length} scored calls.<br><br>`;
  if(highlights)msg+=`<strong>Highlights:</strong><br>${highlights}<br><br>`;
  if(flags)msg+=`<strong>Flags:</strong><br>${flags}<br><br>`;
  msg+=`<strong>Key focus:</strong> ${rep.coaching.key_action}`;
  addMsg('assistant',msg);
}
openingMessage();

/* ── suggestions ── */
const SUGGESTIONS=[
  'What were my strongest calls this week?',
  'What does my weakest call show about my gaps?',
  'What should I do differently on check-in calls?',
  'Explain the new Discovery scorecard criteria',
  'What does Referral Moment Clarity mean?',
  'What is my Q3 target?',
];
SUGGESTIONS.forEach(s=>{
  const btn=document.createElement('button');
  btn.className='suggestion';
  btn.textContent=s;
  btn.onclick=()=>sendMessage(s);
  document.getElementById('suggestions').appendChild(btn);
});

/* ── input ── */
const inp=document.getElementById('input');
const btn=document.getElementById('send-btn');
inp.addEventListener('input',()=>{btn.disabled=!inp.value.trim();inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px';});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!btn.disabled)sendMessage(inp.value);}});
btn.addEventListener('click',()=>sendMessage(inp.value));
</script>
